body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}

.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-40px}

.stat span{font-size:13px;color:var(--mut)}
.tools{margin:26px 0 10px;display:flex;flex-direction:column;gap:12px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.row{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.row{grid-template-columns:2fr 1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.count{color:var(--mut);font-size:14px;margin:8px 0 10px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:48px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--head);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--pri2)}
td.n,th.n{width:52px;text-align:center}
td.s,th.s{text-align:right;font-weight:800;color:var(--pri)}
.jb{display:inline-block;font-size:12px;font-weight:700;color:var(--pri);background:var(--pri2);padding:2px 10px;border-radius:99px}
td.nm{font-weight:600;white-space:normal;min-width:180px}
.empty{text-align:center;color:var(--mut);padding:36px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:26px 16px 40px;border-top:1px solid var(--line)}
footer a{color:var(--pri);font-weight:700}
